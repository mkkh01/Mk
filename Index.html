<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>رسائل من مخطوف</title>
<style>
body {
  background:black;
  color:#eee;
  font-family: Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
#game {
  width:360px;
  background:#111;
  padding:12px;
  border-radius:12px;
  box-shadow:0 0 15px red;
}
img {
  width:100%;
  border-radius:8px;
  margin:8px 0;
}
button {
  width:100%;
  margin-top:6px;
  padding:10px;
  background:#222;
  color:white;
  border:none;
  border-radius:6px;
}
#stats {font-size:11px;color:#777;}
</style>
</head>
<body>

<div id="game">
  <img id="img">
  <div id="text"></div>
  <div id="choices"></div>
  <div id="stats"></div>
</div>

<script>
let F=0, I=0, R=0;
let step=1;

const scenes = {
1:{
  base:"أنا مخطوف… الرقم الوحيد اللي حافظه رقمك.",
  img:"https://i.imgur.com/6R8K4fL.jpg",
  choices:[
    {t:"من أنت؟", i:1},
    {t:"هل أنت مصاب؟", i:1},
    {t:"بلّغ الشرطة", r:1}
  ]
},

2:{
  smart:"أنا اسمي آدم… المكان بارد وفيه رطوبة.",
  fear:"أنا خايف… أسمع أصوات قريبة.",
  rash:"ليش تأخرت؟ في حد يقترب!",
  img:"https://i.imgur.com/xlU1Q0s.jpg",
  choices:[
    {t:"صف لي المكان", i:1},
    {t:"ابقَ هادئ", f:-1},
    {t:"صوّر المكان", r:1}
  ]
},

3:{
  smart:"لمست الجدار… فيه صدأ وباب صغير.",
  fear:"أنا ما نقدرش نتحرك…",
  rash:"وجدت باب وبدون تفكير دفعته!",
  img:"https://i.imgur.com/Br8k4Zd.jpg",
  choices:[
    {t:"افتحه ببطء", i:1},
    {t:"ابقَ مكانك", f:1},
    {t:"اضربه", r:1}
  ]
},

4:{
  smart:"فتحته قليلاً… فيه درج للأعلى.",
  fear:"الصوت قريب… قلبي يدق بسرعة.",
  rash:"طلعت درج بسرعة!",
  img:"https://i.imgur.com/HZ9s0R6.jpg",
  choices:[
    {t:"اصعد ببطء", i:1},
    {t:"اختبئ", f:1},
    {t:"اركض", r:1}
  ]
},

5:{
  smart:"شفت ضوء خافت فوقي.",
  fear:"أنا ارتجف… الضوء يخوفني.",
  rash:"أنا فوق تقريبًا!",
  img:"https://i.imgur.com/w7GCRPb.jpg",
  choices:[
    {t:"راقب المكان", i:1},
    {t:"توقف", f:1},
    {t:"نادِ على أحد", r:1}
  ]
}
};

function getMode(){
  if(I>=F && I>=R) return "smart";
  if(F>=I && F>=R) return "fear";
  return "rash";
}

function loadScene(){
  let s = scenes[step];
  let mode = step==1 ? "base" : getMode();
  document.getElementById("img").src = s.img;
  document.getElementById("text").innerText = s[mode];
  document.getElementById("stats").innerText = `ذكاء:${I} | خوف:${F} | تهور:${R}`;
  let c = document.getElementById("choices");
  c.innerHTML="";
  s.choices.forEach(ch=>{
    let b=document.createElement("button");
    b.innerText=ch.t;
    b.onclick=()=>{
      F+=ch.f||0;
      I+=ch.i||0;
      R+=ch.r||0;
      step++;
      if(!scenes[step]){
        document.getElementById("text").innerText="…هنا نكمل القصة في الجزء التالي";
        c.innerHTML="";
      } else loadScene();
    };
    c.appendChild(b);
  });
}

loadScene();
</script>
</body>
</html>
