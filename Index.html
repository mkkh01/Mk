<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>رسائل من مخطوف</title>
<style>
body {
  margin:0;
  font-family: Tahoma, Arial;
  background: linear-gradient(#000, #111);
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
#game {
  width:90%;
  max-width:400px;
  background:#1a1a1a;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 0 20px #000;
}
#image {
  width:100%;
  height:200px;
  object-fit:cover;
}
#text {
  padding:15px;
  min-height:100px;
}
button {
  width:100%;
  background:#222;
  color:#fff;
  border:none;
  padding:12px;
  margin:5px 0;
  border-radius:8px;
  font-size:16px;
}
button:hover {
  background:#444;
}
</style>
</head>

<body>
<div id="game">
  <img id="image" src="">
  <div id="text"></div>
  <div id="choices"></div>
</div>

<script>
const questions = {
  q1:{
    text:"أنا مخطوف… الرقم الوحيد اللي حفظته رقمك.",
    img:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee",
    choices:[
      {t:"من أنت؟", n:"q2A"},
      {t:"هل أنت مصاب؟", n:"q2B"},
      {t:"لازم نبلغ الشرطة", n:"q2C"}
    ]
  },

  q2A:{
    text:"اسمي سامي… اختطفوني من سيارة أجرة.",
    img:"https://images.unsplash.com/photo-1519681393784-d120267933ba",
    choices:[
      {t:"اسأله عن السائق", n:"q3AA"},
      {t:"اسأله عن المكان", n:"q3AB"}
    ]
  },

  q2B:{
    text:"رجلي تؤلمني ومربوط.",
    img:"https://images.unsplash.com/photo-1500534314209-a26db0f5c8f0",
    choices:[
      {t:"خليه يضغط على الجرح", n:"q3BA"},
      {t:"خليه يهدأ", n:"q3BB"}
    ]
  },

  q2C:{
    text:"لا تقول شرطة… لو عرفوا بيقتلوني.",
    img:"https://images.unsplash.com/photo-1505678261036-a3fcc5e884ee",
    choices:[
      {t:"نكذب ونقول ما بلغناش", n:"q3CA"},
      {t:"نصر على التبليغ", n:"q3CB"}
    ]
  },

  q3AA:{
    text:"السائق كان لابس قبعة سوداء.",
    img:"https://images.unsplash.com/photo-1495433324511-bf8e92934d90",
    choices:[
      {t:"اسأله عن السيارة", n:"q4AAA"},
      {t:"اسأله عن الطريق", n:"q4AAB"}
    ]
  },

  q3AB:{
    text:"كنت قريب من مصنع مهجور.",
    img:"https://images.unsplash.com/photo-1501785888041-af3ef285b470",
    choices:[
      {t:"اسأله عن أصوات", n:"q4ABA"},
      {t:"اسأله عن روائح", n:"q4ABB"}
    ]
  },

  q3BA:{
    text:"الدم خفّ شوي.",
    img:"https://images.unsplash.com/photo-1470337458703-46ad1756a187",
    choices:[
      {t:"اسأله عن الغرفة", n:"q4BAA"},
      {t:"خليه يصور", n:"q4BAB"}
    ]
  },

  q3BB:{
    text:"أنا أرتجف… حد قريب.",
    img:"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85",
    choices:[
      {t:"خليه يسكت", n:"q4BBA"},
      {t:"خليه يخبّي الهاتف", n:"q4BBB"}
    ]
  },

  q3CA:{
    text:"تمام… بس الوقت قصير.",
    img:"https://images.unsplash.com/photo-1519125323398-675f0ddb6308",
    choices:[
      {t:"نسأله عن القيود", n:"q4CAA"},
      {t:"نسأله عن عدد الخاطفين", n:"q4CAB"}
    ]
  },

  q3CB:{
    text:"أسمع باب يُفتح!",
    img:"https://images.unsplash.com/photo-1500534314209-a26db0f5c8f0",
    choices:[
      {t:"خليه يرمي الهاتف", n:"q4CBA"},
      {t:"خليه يخفيه", n:"q4CBB"}
    ]
  },

  q4AAA:{text:"السيارة بيضاء قديمة.",img:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee",choices:[]},
  q4AAB:{text:"مرّينا بطريق ترابي.",img:"https://images.unsplash.com/photo-1501785888041-af3ef285b470",choices:[]},
  q4ABA:{text:"أسمع ماكينات.",img:"https://images.unsplash.com/photo-1505678261036-a3fcc5e884ee",choices:[]},
  q4ABB:{text:"ريحة زيت.",img:"https://images.unsplash.com/photo-1495433324511-bf8e92934d90",choices:[]},
  q4BAA:{text:"غرفة صغيرة.",img:"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85",choices:[]},
  q4BAB:{text:"الإضاءة ضعيفة.",img:"https://images.unsplash.com/photo-1519681393784-d120267933ba",choices:[]},
  q4BBA:{text:"سكت تماماً.",img:"https://images.unsplash.com/photo-1500534314209-a26db0f5c8f0",choices:[]},
  q4BBB:{text:"الهاتف تحت الطاولة.",img:"https://images.unsplash.com/photo-1470337458703-46ad1756a187",choices:[]},
  q4CAA:{text:"مربوط بحبل.",img:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee",choices:[]},
  q4CAB:{text:"اثنين.",img:"https://images.unsplash.com/photo-1501785888041-af3ef285b470",choices:[]},
  q4CBA:{text:"انقطع الاتصال.",img:"https://images.unsplash.com/photo-1505678261036-a3fcc5e884ee",choices:[]},
  q4CBB:{text:"ما زال معنا.",img:"https://images.unsplash.com/photo-1519125323398-675f0ddb6308",choices:[]}
};

let current="q1";

function showQuestion(id){
  const q=questions[id];
  document.getElementById("text").innerText=q.text;
  document.getElementById("image").src=q.img;
  const c=document.getElementById("choices");
  c.innerHTML="";
  q.choices.forEach(ch=>{
    const b=document.createElement("button");
    b.innerText=ch.t;
    b.onclick=()=>showQuestion(ch.n);
    c.appendChild(b);
  });
}

showQuestion(current);
</script>
</body>
</html>
